<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hangman Game</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="container">

        <!-- LOGIN -->
        <div class="box"
             id="loginBox">

            <h1>
                🎮 Hangman Game
            </h1>

            <p class="subtitle">
                Guess the hidden word
            </p>

            <input
                type="text"
                id="playerName"
                placeholder="Enter your name"
            >

            <button id="startBtn">
                Start Game
            </button>

            <button id="adminBtn">
                Admin Login
            </button>

        </div>

        <!-- GAME -->
        <div class="box hidden"
             id="gameBox">

            <div class="topBar">

                <h2 id="playerText">
                    Player
                </h2>

                <div class="stats">

                    <div class="statBox">
                        ❤️ Lives:
                        <span id="lives">
                            6
                        </span>
                    </div>

                    <div class="statBox">
                        ⭐ Score:
                        <span id="score">
                            0
                        </span>
                    </div>

                </div>

            </div>

            <!-- Canvas -->
            <canvas
                id="hangmanCanvas"
                width="300"
                height="300">
            </canvas>

            <!-- Word -->
            <div id="wordDisplay">
            </div>

            <!-- Keyboard -->
            <div id="keyboard">
            </div>

            <!-- Message -->
            <p id="message">
            </p>

        </div>

        <!-- LEADERBOARD -->
        <div class="box hidden"
             id="rankBox">

            <h2>
                🏆 Leaderboard
            </h2>

            <ul id="rankList">
            </ul>

        </div>

        <!-- ADMIN LOGIN -->
        <div class="box hidden"
             id="adminLoginBox">

            <h2>
                🔐 Admin Login
            </h2>

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter admin password"
            >

            <button id="loginAdminBtn">
                Login
            </button>

            <p id="adminError">
            </p>

        </div>

        <!-- ADMIN PANEL -->
        <div class="box hidden"
             id="adminBox">

            <h2>
                👑 Admin Panel
            </h2>

            <div class="adminStats">

                <div class="adminCard">
                    👥 Total Players
                    <h3 id="totalPlayers">
                        0
                    </h3>
                </div>

                <div class="adminCard">
                    ⭐ Total Score
                    <h3 id="totalScore">
                        0
                    </h3>
                </div>

            </div>

            <h3>
                🏆 Top Players
            </h3>

            <ul id="topPlayers">
            </ul>

        </div>

    </div>

    <!-- Firebase -->
    <script type="module"
            src="firebase.js">
    </script>

    <!-- Main Script -->
    <script src="script.js">
    </script>

</body>
</html>
